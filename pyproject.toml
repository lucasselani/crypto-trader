[project]
name = "crypto-trader"
version = "0.1.0"
description = "Agente de swing trade de cripto: dados, estratégias determinísticas, backtest, walk-forward e execução paper/testnet/live"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trader = "trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
